<!doctype html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Unity WebAR - RawImage WebCamTexture</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#unity-container{position:absolute;inset:0}
#unity-canvas{width:100%;height:100%;background:#000}
#detector-video,#detector-canvas{display:none!important;position:absolute;width:1px;height:1px;opacity:0}
#permission-note{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:9999;color:#fff;background:#000b;padding:8px 12px;border-radius:8px;font:14px sans-serif;display:none}
</style>
</head>
<body>
<div id="unity-container"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
<div id="permission-note">Camera access is required. Tap START CAMERA inside the app.</div>
<video id="detector-video" autoplay playsinline muted></video>
<canvas id="detector-canvas"></canvas>

<script>
var Module = { onRuntimeInitialized: function(){ window.cvReady = true; } };
window.cvReady = false;
window.detectorRunning = false;
window.detectorStream = null;
window.detectorTimer = null;
window.detectorVideo = document.getElementById('detector-video');
window.detectorCanvas = document.getElementById('detector-canvas');
window.detectorCtx = window.detectorCanvas.getContext('2d', {willReadFrequently:true});
window.unityTarget = 'ARUcoRawImageWebAR';
window.lastDetectorTime = 0;

function sendUnity(msg){
  if(window.unityInstance && window.unityTarget){
    try{ unityInstance.SendMessage(window.unityTarget,'OnMarkerPose',msg); }catch(e){}
  }
}

async function WebAR_StartDetector(facingMode,width,height,fps,unityObjectName){
  window.unityTarget = unityObjectName || 'ARUcoRawImageWebAR';
  await WebAR_StopDetector();
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    console.warn('getUserMedia unavailable'); return;
  }
  try{
    window.detectorStream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:(facingMode===0?'environment':'user'),width:{ideal:width},height:{ideal:height},frameRate:{ideal:fps,max:fps}},
      audio:false
    });
    window.detectorVideo.srcObject = window.detectorStream;
    await window.detectorVideo.play();
    window.detectorRunning = true;
    requestDetectorFrame();
  }catch(e){
    console.error('Detector camera error',e);
    sendUnity('');
  }
}

async function WebAR_StopDetector(){
  window.detectorRunning = false;
  if(window.detectorTimer) cancelAnimationFrame(window.detectorTimer);
  window.detectorTimer = null;
  if(window.detectorStream){
    window.detectorStream.getTracks().forEach(function(t){t.stop();});
    window.detectorStream = null;
  }
  if(window.detectorVideo) window.detectorVideo.srcObject = null;
}

function requestDetectorFrame(){
  if(!window.detectorRunning) return;
  window.detectorTimer = requestAnimationFrame(processDetectorFrame);
}

function processDetectorFrame(now){
  if(!window.detectorRunning) return;
  // Process at ~15 FPS to reduce mobile CPU usage.
  if(now - window.lastDetectorTime < 66){ requestDetectorFrame(); return; }
  window.lastDetectorTime = now;
  if(!window.cvReady || !window.detectorVideo.videoWidth){ requestDetectorFrame(); return; }

  var vw = window.detectorVideo.videoWidth;
  var vh = window.detectorVideo.videoHeight;
  var maxW = 640;
  var scale = Math.min(1, maxW/vw);
  var w = Math.max(160, Math.round(vw*scale));
  var h = Math.max(120, Math.round(vh*scale));
  window.detectorCanvas.width=w; window.detectorCanvas.height=h;
  window.detectorCtx.drawImage(window.detectorVideo,0,0,w,h);

  try{
    if(!cv.aruco || !cv.aruco.getPredefinedDictionary){ requestDetectorFrame(); return; }
    var src=cv.imread(window.detectorCanvas);
    var gray=new cv.Mat(); cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);
    var dictionary=cv.aruco.getPredefinedDictionary(cv.aruco.DICT_4X4_50);
    var corners=new cv.MatVector(); var ids=new cv.Mat(); var rejected=new cv.MatVector();
    var params=cv.aruco.DetectorParameters ? new cv.aruco.DetectorParameters() : null;
    if(params && cv.aruco.detectMarkers.length>=5) cv.aruco.detectMarkers(gray,dictionary,corners,ids,params,rejected);
    else cv.aruco.detectMarkers(gray,dictionary,corners,ids);

    if(ids.rows>0){
      var id=ids.intAt(0,0);
      if(id<=3){
        var c=corners.get(0);
        var pts=[];
        for(var i=0;i<4;i++) pts.push([c.floatAt(0,i*2),c.floatAt(0,i*2+1)]);
        var cx=(pts[0][0]+pts[1][0]+pts[2][0]+pts[3][0])/4;
        var cy=(pts[0][1]+pts[1][1]+pts[2][1]+pts[3][1])/4;
        var side=(dist(pts[0],pts[1])+dist(pts[1],pts[2])+dist(pts[2],pts[3])+dist(pts[3],pts[0]))/4;
        // Approximate pose from image geometry. Translation is in camera coordinates.
        var fx=0.9*w, fy=0.9*w, px=w/2, py=h/2;
        var marker=0.08;
        var z=(fx*marker)/Math.max(1,side);
        var x=(cx-px)*z/fx;
        var y=(cy-py)*z/fy;
        var angle=Math.atan2(pts[1][1]-pts[0][1],pts[1][0]-pts[0][0]);
        var half=angle/2;
        var qx=0, qy=0, qz=Math.sin(half), qw=Math.cos(half);
        sendUnity(id+','+x+','+y+','+z+','+qx+','+qy+','+qz+','+qw+','+marker);
      }
    } else sendUnity('');

    src.delete();gray.delete();corners.delete();ids.delete();rejected.delete();
  }catch(e){
    // Keep camera alive if OpenCV.js API differs on a browser build.
  }
  requestDetectorFrame();
}
function dist(a,b){var dx=a[0]-b[0],dy=a[1]-b[1];return Math.sqrt(dx*dx+dy*dy);}
</script>
<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<script>
var buildUrl='Build';
var loaderUrl=buildUrl+'/Build.loader.js';
var config={dataUrl:buildUrl+'/Build.data',frameworkUrl:buildUrl+'/Build.framework.js',codeUrl:buildUrl+'/Build.wasm',streamingAssetsUrl:'StreamingAssets',companyName:'WebAR',productName:'ArUco RawImage WebAR',productVersion:'1.0',webglContextAttributes:{alpha:false,antialias:true}};
var canvas=document.querySelector('#unity-canvas');
var script=document.createElement('script');
script.src=loaderUrl;
script.onload=function(){createUnityInstance(canvas,config,function(p){}).then(function(instance){window.unityInstance=instance;}).catch(function(message){alert(message);});};
document.body.appendChild(script);
</script>
</body>
</html>
